[package]
name = "rustic-keys"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
core-foundation = "0.10.1"
cpal = "0.18.2"
hound = "3.5.1"
io-kit-sys = "0.5.0"
libc = "0.2.191"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
